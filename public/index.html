<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask</title>
<style>
:root{--bg:#eef1f4;--ink:#16212b;--mute:#66737f;--line:#d3dae1;--accent:#1f5f8b;--you:#dfe7ee;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#141a20;--ink:#e6ebef;--mute:#8b98a4;--line:#2b3641;--accent:#6fb0dc;--you:#222d37;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;max-width:760px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
h1{font-size:1rem;margin:0;font-weight:600}
button{font:inherit;cursor:pointer}
#new{background:none;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:4px 12px}
#new:hover,#new:focus-visible{border-color:var(--accent);outline:none}
#log{flex:1;overflow-y:auto;padding:18px}
.empty{color:var(--mute);margin-top:20vh}
.msg{display:grid;grid-template-columns:64px 1fr;gap:12px;margin-bottom:20px}
.time{color:var(--mute);font-size:.78rem;padding-top:.35em;text-align:right;font-variant-numeric:tabular-nums}
.body{min-width:0;overflow-wrap:anywhere}
.msg.user .body{background:var(--you);padding:8px 12px;border-radius:10px;justify-self:start}
.msg.bot .body{font-family:ui-serif,Georgia,"Times New Roman",serif;font-size:1.05rem;line-height:1.65}
.body p{margin:0 0 .8em}.body p:last-child{margin:0}
.body ul{margin:0 0 .8em;padding-left:1.2em}
.body a{color:var(--accent)}
.body code,.body pre{font:.88em ui-monospace,Menlo,monospace;background:var(--you);border-radius:4px}
.body code{padding:1px 4px}.body pre{padding:10px;overflow-x:auto}
.src{margin-top:.6em;font:.82rem ui-sans-serif,system-ui,sans-serif;color:var(--mute)}
.src a{color:var(--mute);margin-right:12px}
#status{color:var(--mute);font-size:.85rem;min-height:1.4em;padding:0 18px 4px 94px}
form{display:flex;gap:10px;padding:12px 18px 18px;border-top:1px solid var(--line)}
textarea{flex:1;resize:none;font:inherit;color:inherit;background:transparent;border:1px solid var(--line);border-radius:8px;padding:9px 12px;max-height:160px}
textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#send{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:0 18px}
#send:disabled{opacity:.5;cursor:default}
@media (max-width:520px){.msg{grid-template-columns:1fr;gap:2px}.time{text-align:left}#status{padding-left:18px}}
</style>
</head>
<body>
<header><h1>Ask</h1><button id="new" type="button">New chat</button></header>
<main id="log" aria-live="polite"></main>
<div id="status"></div>
<form id="form">
  <textarea id="q" rows="1" placeholder="Ask anything. I search the web and remember past chats." aria-label="Message"></textarea>
  <button id="send" type="submit">Send</button>
</form>
<script>
const $ = (id) => document.getElementById(id);
const log = $('log'), q = $('q'), send = $('send'), status = $('status');
let conv = localStorage.getItem('conv') || (localStorage.conv = crypto.randomUUID());
const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;

const esc = (s) => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function md(s){
  let h = esc(s)
    .replace(/```(?:\w+\n)?([\s\S]*?)```/g,'<pre>$1</pre>')
    .replace(/`([^`\n]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>')
    .replace(/\[([^\]\n]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/^[ \t]*[-*•][ \t]*$/gm,'')
    .replace(/^\s*[-*•] (.+)$/gm,'<li>$1</li>')
    .replace(/(?:<li>.*<\/li>\n?)+/g,(m)=>'<ul>'+m+'</ul>');
  return h.split(/\n{2,}/).map((p)=>/^<(ul|pre)/.test(p)?p:'<p>'+p.replace(/\n/g,'<br>')+'</p>').join('');
}
const clock = (ms) => new Date(ms).toLocaleString([], {day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
function add(role, text, ts, sources){
  const el = document.createElement('div'); el.className = 'msg ' + role;
  el.innerHTML = '<div class="time">' + clock(ts) + '</div><div class="body"></div>';
  el.lastChild.innerHTML = role === 'user' ? esc(text) : md(text);
  if (sources && sources.length) setSources(el, sources);
  log.appendChild(el); log.scrollTop = log.scrollHeight; return el;
}
function setSources(el, list){
  const d = document.createElement('div'); d.className = 'src';
  d.innerHTML = list.slice(0,6).map((s)=>'<a href="'+esc(s.url)+'" target="_blank" rel="noopener">'+esc(s.title.slice(0,40))+'</a>').join('');
  el.lastChild.appendChild(d);
}
function empty(){ log.innerHTML = '<p class="empty">Ask about prices, releases or news, or about something you asked earlier, like "what did I ask you last Tuesday?"</p>'; }

async function load(){
  const rows = await (await fetch('/api/history?conv=' + conv)).json();
  log.innerHTML = ''; if (!rows.length) return empty();
  rows.forEach((r)=>add(r.role==='user'?'user':'bot', r.content, r.ts, r.sources));
}

$('new').onclick = () => { conv = localStorage.conv = crypto.randomUUID(); empty(); q.focus(); };
q.addEventListener('keydown', (e)=>{ if (e.key==='Enter' && !e.shiftKey){ e.preventDefault(); $('form').requestSubmit(); } });
q.addEventListener('input', ()=>{ q.style.height='auto'; q.style.height=q.scrollHeight+'px'; });

$('form').onsubmit = async (e) => {
  e.preventDefault();
  const text = q.value.trim(); if (!text || send.disabled) return;
  if (log.querySelector('.empty')) log.innerHTML = '';
  q.value = ''; q.style.height = 'auto'; send.disabled = true;
  add('user', text, Date.now());
  const bot = add('bot', '', Date.now()); let answer = '';
  try {
    const res = await fetch('/api/chat', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({conv, message:text, tz})});
    const reader = res.body.getReader(), dec = new TextDecoder(); let buf = '';
    for (;;) {
      const {value, done} = await reader.read(); if (done) break;
      buf += dec.decode(value, {stream:true});
      const parts = buf.split('\n\n'); buf = parts.pop();
      for (const p of parts) {
        if (!p.startsWith('data: ')) continue;
        const ev = JSON.parse(p.slice(6));
        if (ev.type==='status') status.textContent = ev.text;
        else if (ev.type==='text'){ status.textContent=''; answer += ev.text; bot.lastChild.innerHTML = md(answer); }
        else if (ev.type==='sources') setSources(bot, ev.sources);
        else if (ev.type==='error') bot.lastChild.innerHTML = '<p>' + esc(ev.text) + '</p>';
        log.scrollTop = log.scrollHeight;
      }
    }
  } catch { bot.lastChild.innerHTML = '<p>Connection lost. Send your message again.</p>'; }
  status.textContent = ''; send.disabled = false; q.focus();
};
load(); q.focus();
</script>
</body>
</html>
